apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: abfs-module-daemonset
  namespace: jenkins
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector:
    matchLabels:
      app: abfs-module
  template:
    metadata:
      labels:
        app: abfs-module
    spec:
      nodeSelector:
        workloadLabel: android-abfs
      tolerations:
        - key: "workloadType"
          operator: "Equal"
          value: "android-abfs"
          effect: "NoSchedule"
      serviceAccountName: jenkins-sa
      containers:
        - name: abfs-module
          image: ubuntu:24.04
          securityContext:
            privileged: true
          command:
            - /bin/sh
            - -c
            - |
              apt update -y && \
              apt install -y apt-transport-https ca-certificates gnupg curl kmod zip unzip rsync vim && \
              curl https://packages.cloud.google.com/apt/doc/apt-key.gpg | gpg --dearmor -o /usr/share/keyrings/cloud.google.gpg && \
              echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" | tee -a /etc/apt/sources.list.d/google-cloud-sdk.list && \
              apt update -y && apt install -y google-cloud-cli && \
              echo 'deb http://packages.cloud.google.com/apt apt-transport-artifact-registry-stable main' | tee -a /etc/apt/sources.list.d/artifact-registry.list && \
              curl https://packages.cloud.google.com/apt/doc/apt-key.gpg | apt-key add - && \
              apt update -y && apt install -y apt-transport-artifact-registry && \
              echo 'deb ar+https://us-apt.pkg.dev/projects/abfs-binaries abfs-apt-alpha-public main' | tee -a /etc/apt/sources.list.d/artifact-registry.list && \
              apt update -y && \
              gcloud artifacts files list --project=abfs-binaries --location=us --repository=abfs-apt-alpha-public | grep -e "pool/casfs-kmod-$(uname -r)_0.0.33-8-gb8d2d6b" | awk '{print $1}' | while read a; do gcloud artifacts files download --project=abfs-binaries --location=us --repository=abfs-apt-alpha-public --destination=. $a; done && \
              ls pool* | while read a; do apt install "./$a"; done && \
              depmod -a && \
              modprobe casfs && \
              sleep infinity
          volumeMounts:
            - name: modules
              mountPath: /lib/modules
              readOnly: false
      volumes:
        - name: modules
          hostPath:
            path: /lib/modules
